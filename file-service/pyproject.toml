[project]
name = "file-service"
version = "0.1.0"
description = "AICHAN file storage service with SHA-256 object keys."
authors = [
    { name = "魂辛カラ", email = "tamakara@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "minio>=7.2.16",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
]

[project.scripts]
file-service = "file_service.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
