version: 3
name: aichan-local
displayName: AICHAN Local MCP Catalog
registry:
  tool-mcp-server:
    title: Tool MCP Server
    type: remote
    description: AICHAN custom MCP tools for QQ context, files, image understanding, and video understanding.
    remote:
      transport_type: streamable-http
      url: http://tool-mcp-server:8030/mcp
    tools:
      - name: qq_get_message_history
      - name: qq_get_user_info
      - name: file_get_metadata
      - name: file_read_text
      - name: image_describe
      - name: video_describe
    prompts: 0
    resources: {}
