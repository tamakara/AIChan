version: 3
name: aichan-local
displayName: AICHAN Local MCP Catalog
registry:
  tool-mcp-server:
    title: Tool MCP Server
    type: remote
    description: AICHAN adapter, file, media understanding, and memory tools.
    remote:
      transport_type: streamable-http
      url: http://tool-mcp-server:8030/mcp
    tools:
      - name: adapter_invoke
      - name: file_get_metadata
      - name: file_read_text
      - name: memory_get_user_memory
      - name: image_describe
      - name: video_describe
    prompts: 0
    resources: {}
