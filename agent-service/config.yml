server:
  host: 0.0.0.0
  port: 8000

agent:
  model: mimo-v2-flash
  max_turns: 50
  temperature: 0.5
  llm_timeout: 30.0
  llm_max_retries: 3
  openai_api_key: ""
  openai_base_url: https://api.xiaomimimo.com/v1
  mcp_sse_url: http://mcp-gateway:9000/sse
  mcp_auth_token: ""
  langfuse:
    enabled: true
    host: https://us.cloud.langfuse.com
    public_key: ""
    secret_key: ""
    flush_at: 16
    flush_interval: 0.5
    request_timeout: 15.0
