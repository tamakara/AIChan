services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  mcp-gateway:
    image: docker/mcp-gateway:latest
    restart: unless-stopped
    command:
      - --transport=sse
      - --port=9000
      - --servers=playwright,fetch,time,docker://adapter-service:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  agent-service:
    build:
      context: ./agent-service
    restart: unless-stopped
    depends_on:
      - mcp-gateway
    volumes:
      - ./agent-service/config.yml:/app/agent-service/config.yml:ro
    ports:
      - "8000:8000"

  adapter-service:
    image: adapter-service:latest
    build:
      context: ./adapter-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    command:
      - adapter-service
    volumes:
      - ./adapter-service/config.yml:/app/adapter-service/config.yml:ro
    ports:
      - "8010:8010"

  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    depends_on:
      adapter-service:
        condition: service_started
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - WEBUI_TOKEN=${NAPCAT_WEBUI_TOKEN:-napcat}
    volumes:
      # 固化 OneBot 反向 WS 配置，自动连接 adapter-service。
      - ./napcat/config/onebot11.json:/app/napcat/config/onebot11.json
      # 持久化 QQ 登录态，避免容器重启后重复扫码。
      - ./napcat/ntqq:/app/.config/QQ
    ports:
      - "6099:6099"

  hub-service:
    build:
      context: ./hub-service
    restart: unless-stopped
    depends_on:
      agent-service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./hub-service/config.yml:/app/hub-service/config.yml:ro
    ports:
      - "8020:8020"

