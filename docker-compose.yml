services:
  mcp-gateway:
    image: docker/mcp-gateway:latest
    restart: unless-stopped
    command:
      - --transport=sse
      - --port=9000
      - --servers=playwright,fetch,time,docker://napcat-mcp-server:latest
    ports:
      - "19000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  agent-service:
    build:
      context: ./agent-service
    restart: unless-stopped
    depends_on:
      - mcp-gateway
    environment:
      AGENT__MODEL: "${AGENT__MODEL:?AGENT__MODEL is required}"
      AGENT__OPENAI_API_KEY: "${AGENT__OPENAI_API_KEY:?AGENT__OPENAI_API_KEY is required}"
      AGENT__OPENAI_BASE_URL: "${AGENT__OPENAI_BASE_URL:-https://api.xiaomimimo.com/v1}"
      AGENT__MCP_AUTH_TOKEN: "${AGENT__MCP_AUTH_TOKEN:-}"
      AGENT__LANGFUSE__PUBLIC_KEY: "${AGENT__LANGFUSE__PUBLIC_KEY:?AGENT__LANGFUSE__PUBLIC_KEY is required}"
      AGENT__LANGFUSE__SECRET_KEY: "${AGENT__LANGFUSE__SECRET_KEY:?AGENT__LANGFUSE__SECRET_KEY is required}"
    volumes:
      - ./agent-service/config.yml:/app/agent-service/config.yml:ro
    ports:
      - "18000:8000"

  napcat-mcp-server:
    image: napcat-mcp-server:latest
    build:
      context: ./napcat-mcp-server
    restart: unless-stopped
    command:
      - napcat-mcp-server
    volumes:
      - ./napcat-mcp-server/config.yml:/app/napcat-mcp-server/config.yml:ro

  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    depends_on:
      hub-service:
        condition: service_started
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
    volumes:
      - ./napcat/config/napcat.json:/app/napcat/config/napcat.json
      - ./napcat/config/onebot11.json:/app/napcat/config/onebot11.json
      - ./napcat/config/webui.json:/app/napcat/config/webui.json
      - ./napcat/ntqq:/app/.config/QQ
    ports:
      - "6099:6099"

  hub-service:
    build:
      context: ./hub-service
    restart: unless-stopped
    depends_on:
      agent-service:
        condition: service_started
    volumes:
      - ./hub-service/config.yml:/app/hub-service/config.yml:ro
    ports:
      - "18020:8020"
