services:
  memory-service:
    build:
      context: ./memory-service
    restart: unless-stopped
    environment:
      MEMORY__MODEL: "${MEMORY__MODEL:?MEMORY__MODEL is required}"
      MEMORY__OPENAI_API_KEY: "${MEMORY__OPENAI_API_KEY:?MEMORY__OPENAI_API_KEY is required}"
      MEMORY__OPENAI_BASE_URL: "${MEMORY__OPENAI_BASE_URL:-https://api.xiaomimimo.com/v1}"
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',8050),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - ./memory-service/config.yml:/app/memory-service/config.yml:ro
      - memory-service-data:/data/memories

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      memory-service:
        condition: service_healthy
    environment:
      CORE__MODEL: "${CORE__MODEL:?CORE__MODEL is required}"
      CORE__OPENAI_API_KEY: "${CORE__OPENAI_API_KEY:?CORE__OPENAI_API_KEY is required}"
      CORE__OPENAI_BASE_URL: "${CORE__OPENAI_BASE_URL:-https://api.xiaomimimo.com/v1}"
      CORE__ADAPTER_TOKENS: "${CORE__ADAPTER_TOKENS:-{}}"
      CORE__LANGFUSE__HOST: "${CORE__LANGFUSE__HOST:?CORE__LANGFUSE__HOST is required}"
      CORE__LANGFUSE__PUBLIC_KEY: "${CORE__LANGFUSE__PUBLIC_KEY:?CORE__LANGFUSE__PUBLIC_KEY is required}"
      CORE__LANGFUSE__SECRET_KEY: "${CORE__LANGFUSE__SECRET_KEY:?CORE__LANGFUSE__SECRET_KEY is required}"
      CORE__PERCEPTION__OPENAI_BASE_URL: "${CORE__PERCEPTION__OPENAI_BASE_URL:-}"
      CORE__PERCEPTION__OPENAI_API_KEY: "${CORE__PERCEPTION__OPENAI_API_KEY:-}"
      CORE__PERCEPTION__VISUAL_MODEL: "${CORE__PERCEPTION__VISUAL_MODEL:-}"
      CORE__PERCEPTION__AUDIO_MODEL: "${CORE__PERCEPTION__AUDIO_MODEL:-}"
      CORE__PERCEPTION__VIDEO_FRAME_COUNT: "${CORE__PERCEPTION__VIDEO_FRAME_COUNT:-6}"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./core-service/config.yml:/app/core-service/config.yml:ro
      - ./core-service/prompts:/app/core-service/prompts:ro
      - ./skills:/app/skills:ro
    ports:
      - "18020:8020"

volumes:
  memory-service-data:
