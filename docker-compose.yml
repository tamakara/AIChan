services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  mcp-gateway:
    image: docker/mcp-gateway:latest
    restart: unless-stopped
    command:
      - --transport=sse
      - --port=9000
      - --servers=playwright,fetch,time,docker://adapter-service:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  agent-service:
    build:
      context: ./agent-service
    restart: unless-stopped
    depends_on:
      - mcp-gateway
    volumes:
      - ./agent-service/config.yml:/app/agent-service/config.yml:ro
    ports:
      - "8000:8000"

  adapter-service:
    image: adapter-service:latest
    build:
      context: ./adapter-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    command:
      - adapter-service
    volumes:
      - ./adapter-service/config.yml:/app/adapter-service/config.yml:ro
    ports:
      - "8010:8010"

  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    depends_on:
      adapter-service:
        condition: service_started
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
    volumes:
      # 只挂载默认配置文件，避免账号级运行时配置回写到仓库。
      - ./napcat/config/napcat.json:/app/napcat/config/napcat.json
      - ./napcat/config/onebot11.json:/app/napcat/config/onebot11.json
      - ./napcat/config/webui.json:/app/napcat/config/webui.json
      # 持久化登录二维码，便于宿主机直接查看。
      - ./napcat/cache/qrcode.png:/app/napcat/cache/qrcode.png
      # 持久化 QQ 登录态，避免容器重启后重复扫码。
      - ./napcat/ntqq:/app/.config/QQ
    ports:
      - "6099:6099"

  hub-service:
    build:
      context: ./hub-service
    restart: unless-stopped
    depends_on:
      agent-service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./hub-service/config.yml:/app/hub-service/config.yml:ro
    ports:
      - "8020:8020"
