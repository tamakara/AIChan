[project]
name = "aichan-qq-adapter"
version = "0.1.0"
description = "AICHAN QQ adapter for NapCat/OneBot v11."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.34.0",
    "websockets>=16.0"
]

[project.optional-dependencies]
test = ["pytest>=8.3.4", "pytest-asyncio>=0.25.2"]

[project.scripts]
aichan-qq-adapter = "aichan_qq_adapter.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
