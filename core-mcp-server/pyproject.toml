[project]
name = "core-mcp-server"
version = "0.1.0"
description = "AICHAN file, vision, and memory MCP tools."
authors = [
    { name = "魂辛カラ", email = "tamakara@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "mcp>=1.13.0",
    "opencv-python-headless>=4.10.0.84",
    "openai>=1.99.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
]

[project.scripts]
core-mcp-server = "core_mcp_server.mcp_main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
