[project]
name = "napcat-mcp-server"
version = "0.1.0"
description = "NapCat MCP server — exposes OneBot v11 tools via MCP for agent-service."
authors = [
    { name = "魂辛カラ", email = "tamakara@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "mcp>=1.13.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
]

[project.scripts]
napcat-mcp-server = "napcat_mcp_server.main:main"
napcat-mcp-mcp = "napcat_mcp_server.mcp_main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
