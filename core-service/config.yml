core:
  host: 0.0.0.0
  port: 8020
  log_level: info
  model: ""
  openai_api_key: ""
  openai_base_url: ""
  temperature: 0.8
  max_turns: 20
  llm_timeout: 30.0
  llm_max_retries: 3
  memory_enabled: true
  memory_base_url: http://memory-service:8050
  memory_timeout: 10.0
  memory_compress_every_n_records: 10
  debounce_seconds: 2.0
  ack_timeout_seconds: 10.0
  ack_max_attempts: 3
  capability_timeout_seconds: 30.0
  adapter_tokens: {}
  system_prompt_path: core-service/prompts/system.md
  skills_root: skills/system
  max_skill_bytes: 65536
  max_skill_snapshot_bytes: 262144
  max_xml_bytes: 262144
  file_cache:
    root_dir: /tmp/aichan-file-cache
    ttl_seconds: 3600
    cleanup_interval_seconds: 600
    max_file_bytes: 10485760
  perception:
    openai_base_url: ""
    openai_api_key: ""
    visual_model: ""
    audio_model: ""
    timeout_seconds: 30.0
    video_frame_count: 6
  langfuse:
    enabled: true
    host: ""
    public_key: ""
    secret_key: ""
    flush_at: 16
    flush_interval: 0.5
    request_timeout: 15.0
